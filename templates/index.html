<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanVaani</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { color: #166534; margin-bottom: 5px;}
        
        /* Welcome Screen Styles */
        #welcome-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
        .role-container { display: flex; gap: 20px; margin-top: 30px; }
        .role-btn {
            width: 150px; height: 150px; border-radius: 20px; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .role-btn.seller { background-color: #22c55e; }
        .role-btn.buyer { background-color: #3b82f6; }
        .role-btn span { font-size: 40px; margin-bottom: 10px; }
        
        /* Main App Styles */
        #app-screen { display: none; flex-direction: column; align-items: center; }
        .mic-button {
            background-color: #22c55e; color: white; border: none; border-radius: 50%;
            width: 200px; height: 200px; font-size: 24px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4); transition: transform 0.1s;
            margin-top: 30px;
        }
        .mic-button:active { transform: scale(0.95); }
        .mic-button.listening { animation: pulse 1.5s infinite; background-color: #ef4444; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        #result-card {
            margin-top: 30px; background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; min-width: 300px;
        }
        .price-text { font-size: 48px; font-weight: bold; color: #15803d; margin: 10px 0; }
        .crop-text { font-size: 28px; color: #333; font-weight: bold;}
        .instruction { margin-top: 20px; color: #666; font-size: 14px;}
        .reset-btn { margin-top: 20px; padding: 10px; background: #ccc; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <h1>Welcome to KisanVaani</h1>
        <p>Please select your role / कृपया अपनी भूमिका चुनें</p>
        <div class="role-container">
            <button class="role-btn seller" onclick="setRole('seller')">
                <span>🚜</span> Farmer <br> (Sell)
            </button>
            <button class="role-btn buyer" onclick="setRole('buyer')">
                <span>⚖️</span> Trader <br> (Buy)
            </button>
        </div>
    </div>

    <!-- 2. MAIN APP SCREEN -->
    <div id="app-screen">
        <h1 id="roleTitle">KisanVaani</h1>
        <button id="micBtn" class="mic-button">🎤 TAP</button>
        <div class="instruction" id="statusText">Waiting for your voice...</div>

        <div id="result-card">
            <div class="crop-text" id="cropName">Crop</div>
            <div class="price-text" id="priceValue">₹0</div>
            <div id="voiceReply" style="font-size: 18px; color: #555; margin-top: 10px;"></div>
            <div style="font-size: 12px; color: #888; margin-top: 10px;" id="langDetect"></div>
        </div>
        
        <button class="reset-btn" onclick="location.reload()">Go Back</button>
    </div>

    <script>
        let currentRole = "seller";
        let recognition;
        
        // Language Dictionary for Voice Synthesis
        const langVoiceMap = {
            'hi': 'hi-IN', 'mr': 'mr-IN', 'te': 'te-IN', 
            'ta': 'ta-IN', 'bn': 'bn-IN', 'gu': 'gu-IN', 'pa': 'pa-IN', 'en': 'en-IN'
        };

        function setRole(role) {
            currentRole = role;
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            
            if (role === 'seller') {
                document.getElementById('roleTitle').innerText = "Farmer Dashboard (Seller)";
                document.getElementById('micBtn').style.backgroundColor = "#22c55e";
            } else {
                document.getElementById('roleTitle').innerText = "Trader Dashboard (Buyer)";
                document.getElementById('micBtn').style.backgroundColor = "#3b82f6";
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN'; // Starts with Indian English to catch mixed words

            recognition.onstart = function() {
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('micBtn').innerHTML = "Listening...";
                document.getElementById('statusText').innerText = "Speak now...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('statusText').innerText = "You said: " + transcript;
                processSpeech(transcript);
            };

            recognition.onerror = function(event) {
                document.getElementById('statusText').innerText = "Error: " + event.error;
                resetMic();
            };

            recognition.onend = function() { resetMic(); };
        }

        document.getElementById('micBtn').onclick = function() {
            if (recognition) {
                document.getElementById('result-card').style.display = 'none';
                recognition.start();
            }
        };

        function resetMic() {
            const btn = document.getElementById('micBtn');
            btn.classList.remove('listening');
            btn.innerHTML = "🎤 TAP";
        }

        function processSpeech(text) {
            fetch('/api/voice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, role: currentRole })
            })
            .then(response => response.json())
            .then(data => {
                const resultCard = document.getElementById('result-card');
                resultCard.style.display = 'block';
                
                if (data.crop_display) {
                    document.getElementById('cropName').innerText = data.crop_display;
                    document.getElementById('priceValue').innerText = "₹" + data.price;
                    document.getElementById('langDetect').innerText = "Detected Language: " + data.detected_lang.toUpperCase();
                } else {
                    document.getElementById('cropName').innerText = "Not Found";
                    document.getElementById('priceValue').innerText = "---";
                }
                
                document.getElementById('voiceReply').innerText = data.spoken_response;
                
                // Speak the reply in the detected language
                speakText(data.spoken_response, data.detected_lang || 'en');
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('statusText').innerText = "Connection error.";
            });
        }

        function speakText(text, langCode) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langVoiceMap[langCode] || 'en-IN';
                utterance.rate = 0.9; 
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
